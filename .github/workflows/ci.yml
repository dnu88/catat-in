name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-quality-gate:
    name: Web quality gate (typecheck + unit + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (web)
        run: pnpm --filter @catat-in/web type-check

      - name: Unit tests (web)
        run: pnpm --filter @catat-in/web test

      - name: Build (web)
        run: pnpm --filter @catat-in/web build

  backend-quality-gate:
    name: Backend quality gate (pytest)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  mobile-quality-gate:
    name: Mobile PWA quality gate (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm --filter mobile type-check

      - name: Critical regression tests
        run: pnpm --filter mobile test tabs-index reports-screen reports-ai-insight transactions-swipe-actions -- --runInBand

      - name: Export PWA (build check)
        run: pnpm --filter mobile export:pwa

      - name: Bundle marker audit
        run: pnpm --filter mobile check:bundle

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: web-quality-gate
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Skip E2E when Firebase secrets are unavailable
        if: ${{ env.VITE_FIREBASE_API_KEY == '' || env.VITE_FIREBASE_AUTH_DOMAIN == '' || env.VITE_FIREBASE_PROJECT_ID == '' || env.VITE_FIREBASE_STORAGE_BUCKET == '' || env.VITE_FIREBASE_MESSAGING_SENDER_ID == '' || env.VITE_FIREBASE_APP_ID == '' }}
        run: echo "Skipping E2E smoke because Firebase secrets are not configured."

      - name: Checkout
        if: ${{ env.VITE_FIREBASE_API_KEY != '' && env.VITE_FIREBASE_AUTH_DOMAIN != '' && env.VITE_FIREBASE_PROJECT_ID != '' && env.VITE_FIREBASE_STORAGE_BUCKET != '' && env.VITE_FIREBASE_MESSAGING_SENDER_ID != '' && env.VITE_FIREBASE_APP_ID != '' }}
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: ${{ env.VITE_FIREBASE_API_KEY != '' && env.VITE_FIREBASE_AUTH_DOMAIN != '' && env.VITE_FIREBASE_PROJECT_ID != '' && env.VITE_FIREBASE_STORAGE_BUCKET != '' && env.VITE_FIREBASE_MESSAGING_SENDER_ID != '' && env.VITE_FIREBASE_APP_ID != '' }}
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: ${{ env.VITE_FIREBASE_API_KEY != '' && env.VITE_FIREBASE_AUTH_DOMAIN != '' && env.VITE_FIREBASE_PROJECT_ID != '' && env.VITE_FIREBASE_STORAGE_BUCKET != '' && env.VITE_FIREBASE_MESSAGING_SENDER_ID != '' && env.VITE_FIREBASE_APP_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: ${{ env.VITE_FIREBASE_API_KEY != '' && env.VITE_FIREBASE_AUTH_DOMAIN != '' && env.VITE_FIREBASE_PROJECT_ID != '' && env.VITE_FIREBASE_STORAGE_BUCKET != '' && env.VITE_FIREBASE_MESSAGING_SENDER_ID != '' && env.VITE_FIREBASE_APP_ID != '' }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: ${{ env.VITE_FIREBASE_API_KEY != '' && env.VITE_FIREBASE_AUTH_DOMAIN != '' && env.VITE_FIREBASE_PROJECT_ID != '' && env.VITE_FIREBASE_STORAGE_BUCKET != '' && env.VITE_FIREBASE_MESSAGING_SENDER_ID != '' && env.VITE_FIREBASE_APP_ID != '' }}
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke
        if: ${{ env.VITE_FIREBASE_API_KEY != '' && env.VITE_FIREBASE_AUTH_DOMAIN != '' && env.VITE_FIREBASE_PROJECT_ID != '' && env.VITE_FIREBASE_STORAGE_BUCKET != '' && env.VITE_FIREBASE_MESSAGING_SENDER_ID != '' && env.VITE_FIREBASE_APP_ID != '' }}
        working-directory: apps/web
        env:
          CI: "true"
        run: pnpm test:e2e
