services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaswise-backend
    restart: unless-stopped
    expose:
      - "8000"           # Hanya expose ke Docker network, tidak ke host langsung
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PORT=8000
      - UVICORN_WORKERS=2
      # ── Security ──────────────────────────────────────
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # ── Supabase (wajib untuk JWT auth) ───────────────
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_AUDIENCE=${SUPABASE_JWT_AUDIENCE:-authenticated}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      # ── CORS ──────────────────────────────────────────
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-false}
      # ── AI ────────────────────────────────────────────
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      # ── Midtrans ──────────────────────────────────────
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY:-}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY:-}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
      # ── Storage ───────────────────────────────────────
      - STORAGE_BUCKET_RECEIPTS=${STORAGE_BUCKET_RECEIPTS:-receipts}
      - STORAGE_BUCKET_AVATARS=${STORAGE_BUCKET_AVATARS:-avatars}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-10}
    networks:
      - proxy-network     # Satu network dengan Nginx Proxy Manager
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

networks:
  proxy-network:
    external: true        # Pakai network yang sama dengan Nginx Proxy Manager
    name: proxy-network
