services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaswise-backend
    restart: unless-stopped
    # ── Container hardening (rekonstruksi dari overlay lama yang hilang) ──
    # Disamakan persis dengan konfigurasi container live: read-only rootfs,
    # drop semua capability, no-new-privileges, tmpfs untuk /tmp, batas resource.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    expose:
      - "8000"           # Hanya expose ke Docker network, tidak ke host langsung
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PORT=8000
      - UVICORN_WORKERS=2
      # ── Security ──────────────────────────────────────
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # ── Supabase (wajib untuk JWT auth) ───────────────
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_AUDIENCE=${SUPABASE_JWT_AUDIENCE:-authenticated}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - SUPABASE_JWT_ALLOWED_ALGORITHMS=${SUPABASE_JWT_ALLOWED_ALGORITHMS:-RS256,ES256}
      - SUPABASE_LEGACY_HS256_ENABLED=${SUPABASE_LEGACY_HS256_ENABLED:-false}
      - SUPABASE_JWKS_CACHE_SECONDS=${SUPABASE_JWKS_CACHE_SECONDS:-3600}
      - SUPABASE_JWKS_NEGATIVE_CACHE_SECONDS=${SUPABASE_JWKS_NEGATIVE_CACHE_SECONDS:-60}
      # ── CORS ──────────────────────────────────────────
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-false}
      # ── AI ────────────────────────────────────────────
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      # ── Midtrans ──────────────────────────────────────
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY:-}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY:-}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
      # ── Payment Provider ──────────────────────────────
      - PAYMENT_PRIMARY_PROVIDER=${PAYMENT_PRIMARY_PROVIDER:-midtrans}
      # ── Mayar ─────────────────────────────────────────
      - MAYAR_API_KEY=${MAYAR_API_KEY:-}
      - MAYAR_BASE_URL=${MAYAR_BASE_URL:-https://api.mayar.id/hl/v1}
      - MAYAR_REDIRECT_URL=${MAYAR_REDIRECT_URL:-}
      - MAYAR_WEBHOOKS_ENABLED=${MAYAR_WEBHOOKS_ENABLED:-false}
      - MAYAR_ACTIVATION_ENABLED=${MAYAR_ACTIVATION_ENABLED:-false}
      - MAYAR_ALLOWED_EMAILS=${MAYAR_ALLOWED_EMAILS:-}
      - MAYAR_MERCHANT_ID=${MAYAR_MERCHANT_ID:-}
      # ── Storage ───────────────────────────────────────
      - STORAGE_BUCKET_RECEIPTS=${STORAGE_BUCKET_RECEIPTS:-receipts}
      - STORAGE_BUCKET_AVATARS=${STORAGE_BUCKET_AVATARS:-avatars}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-10}
      - RATE_LIMIT_AI_ENDPOINT=${RATE_LIMIT_AI_ENDPOINT:-20}
      - RATE_LIMIT_IMPORT_ENDPOINT=${RATE_LIMIT_IMPORT_ENDPOINT:-10}
    networks:
      - proxy-network     # Satu network dengan Nginx Proxy Manager
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

networks:
  proxy-network:
    external: true        # Pakai network yang sama dengan Nginx Proxy Manager
    name: proxy-network
