# Kaswise SSH hardening drop-in
# Target: /etc/ssh/sshd_config.d/99-kaswise-hardening.conf
# Di-include otomatis oleh sshd_config Ubuntu 24.04.
# Dikelola oleh ops/hardening/host/01-ssh-hardening.sh

# --- Akun & auth ---
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
UsePAM yes

# --- Batas percobaan & sesi ---
MaxAuthTries 3
MaxSessions 6
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Forwarding ---
# WAJIB yes: user akses NPM admin (port 81) lewat SSH tunnel.
AllowTcpForwarding yes
AllowAgentForwarding no
X11Forwarding no
GatewayPorts no

# --- Lain-lain ---
PrintLastLog yes
Banner none
