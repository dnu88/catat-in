<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Components · Buttons</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card" style="background:#0A0A0A; color:#FFF; padding: 22px 24px; gap: 18px;">
  <div>
    <div style="font-size:11px; font-weight:700; letter-spacing:0.18em; color:#A3FF12; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">BUTTONS</div>
    <div style="font-size:30px; font-weight:800; letter-spacing:-0.7px; color:#FFF; margin-top: 6px;">Press for prosperity.</div>
  </div>

  <!-- Row 1 — primary / secondary / danger / ghost -->
  <div class="row" style="gap: 12px; flex-wrap: wrap; align-items: center;">
    <button style="
      background:#A3FF12; color:#0A0A0A; border:none; border-radius:999px;
      padding:14px 22px; font-size:14px; font-weight:800; letter-spacing:0.02em;
      font-family: var(--ks-font-sans); cursor:pointer;
      box-shadow: 0 0 22px rgba(163,255,18,0.30), 0 12px 28px rgba(163,255,18,0.18);">
      Simpan transaksi
    </button>
    <button style="
      background: rgba(255,255,255,0.06); color:#FFF;
      border:1px solid rgba(255,255,255,0.12); border-radius:999px;
      padding:14px 22px; font-size:14px; font-weight:700;
      font-family: var(--ks-font-sans); cursor:pointer;
      backdrop-filter: blur(10px);">
      Lewati
    </button>
    <button style="
      background: rgba(255,123,123,0.12); color:#FF7B7B;
      border:1px solid rgba(255,123,123,0.35); border-radius:999px;
      padding:14px 22px; font-size:14px; font-weight:800;
      font-family: var(--ks-font-sans); cursor:pointer;">
      Hapus
    </button>
    <button style="
      background: transparent; color:#9CA3AF; border:none;
      padding:14px 18px; font-size:14px; font-weight:700;
      font-family: var(--ks-font-sans); cursor:pointer;">
      Batalkan
    </button>
  </div>

  <!-- Row 2 — header pill / small chip / icon / disabled -->
  <div class="row" style="gap: 12px; flex-wrap: wrap; align-items: center;">
    <button style="
      background:#A3FF12; color:#0A0A0A; border:none; border-radius:999px;
      padding:9px 16px; font-size:12px; font-weight:800;
      font-family: var(--ks-font-sans); cursor:pointer;
      box-shadow: 0 0 14px rgba(163,255,18,0.30);">
      + Tambah
    </button>
    <button style="
      background:#A3FF12; color:#0A0A0A; border:none; border-radius:999px;
      padding:8px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em;
      font-family: var(--ks-font-sans); cursor:pointer;">
      RESET
    </button>
    <button style="
      width:48px; height:48px; border-radius:50%;
      background:#A3FF12; color:#0A0A0A; border:none;
      font-size:22px; font-weight:800; cursor:pointer;
      box-shadow: 0 0 22px rgba(163,255,18,0.45), 0 12px 28px rgba(163,255,18,0.22);">
      +
    </button>
    <button style="
      background: rgba(163,255,18,0.18); color:#A3FF12; border:none; border-radius:999px;
      padding:14px 22px; font-size:14px; font-weight:800;
      font-family: var(--ks-font-sans); opacity:0.45; cursor:not-allowed;">
      Loading…
    </button>
  </div>

  <div style="font-size:11px; color:#6B7280; line-height:1.6;">
    Primary CTAs always carry the <b style="color:#A3FF12;">neon glow</b> (22 px @ 30% + 28 px @ 18%). Secondary uses glass (6% fill, 12% border, 10 px blur). Danger keeps the coral status colour at 12% fill. Ghost = text only, no decoration.
  </div>
</div>
</body>
</html>
