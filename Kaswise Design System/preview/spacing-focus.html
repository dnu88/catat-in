<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing · Focus Ring</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card" style="background:#0A0A0A; color:#FFF; padding: 22px 24px;">
  <div class="row" style="gap: 24px; align-items: stretch;">

    <!-- Left: eyebrow + heading -->
    <div class="col" style="flex: 1; justify-content: center; gap: 14px;">
      <div style="font-size:10px; font-weight:700; letter-spacing:0.16em; color:#A3FF12; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">
        08 · FOCUS
      </div>
      <div style="font-size:34px; font-weight:800; letter-spacing:-0.8px; line-height:1.05; color:#FFF;">
        A ring of neon.
      </div>
      <div style="font-size:12px; line-height:1.55; color:#9CA3AF; max-width: 38ch;">
        Every interactive element gets a 3 px ring at 25% neon emerald on focus. Required for AA keyboard accessibility — never disable it, never tint it to brand secondary.
      </div>
    </div>

    <!-- Right: specimen card -->
    <div style="flex: 1.1; background:#161616; border:1px solid rgba(255,255,255,0.06); border-radius:20px; padding: 18px 20px; display:flex; flex-direction:column;">
      <!-- header row -->
      <div style="display:flex; justify-content:space-between; align-items:flex-end; padding-bottom: 12px; border-bottom:1px solid rgba(255,255,255,0.08);">
        <div style="font-size:26px; font-weight:500; letter-spacing:-0.5px; color:#FFF;">Input states</div>
        <div style="font-size:12px; color:#A3FF12; font-weight:600;">3 / 25%</div>
      </div>

      <!-- specimen rows -->
      <div style="display:flex; flex-direction:column; gap: 14px; padding-top: 16px;">
        <!-- rest -->
        <div style="display:flex; flex-direction:column; gap:6px;">
          <div style="font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#6B7280;">Email · rest</div>
          <div style="background:#0A0A0A; border:1px solid rgba(255,255,255,0.10); border-radius:10px; padding:11px 14px; font-size:13px; color:#6B7280;">email@kaswise.app</div>
        </div>
        <!-- focus -->
        <div style="display:flex; flex-direction:column; gap:6px;">
          <div style="font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#A3FF12;">Email · focus</div>
          <div style="background:#0A0A0A; border:1px solid #A3FF12; border-radius:10px; padding:11px 14px; font-size:13px; color:#FFF; box-shadow: 0 0 0 3px rgba(163,255,18,0.25);">
            email@kaswise.app<span style="opacity:0.4;">|</span>
          </div>
        </div>
        <!-- error -->
        <div style="display:flex; flex-direction:column; gap:6px;">
          <div style="font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#FF7B7B;">Email · error</div>
          <div style="background: rgba(255,123,123,0.06); border:1px solid #FF7B7B; border-radius:10px; padding:11px 14px; font-size:13px; color:#FFF; box-shadow: 0 0 0 3px rgba(255,123,123,0.20);">
            email
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
