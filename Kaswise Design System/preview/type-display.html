<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type · Display</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card" style="background:#0A0A0A; color:#FFF; padding: 22px 24px;">
  <div class="row" style="gap: 24px; align-items: stretch;">

    <!-- Left: section eyebrow + heading -->
    <div class="col" style="flex: 1; justify-content: center; gap: 14px;">
      <div style="font-size:10px; font-weight:700; letter-spacing:0.16em; color:#A3FF12; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">
        03 · TYPOGRAPHY
      </div>
      <div style="font-size:34px; font-weight:800; letter-spacing:-0.8px; line-height:1.05; color:#FFF;">
        Clean &amp; Modern.
      </div>
      <div style="font-size:12px; line-height:1.55; color:#9CA3AF; max-width: 38ch;">
        A highly legible, modern sans-serif typeface ensures clarity in complex financial dashboards while maintaining a premium aesthetic.
      </div>
    </div>

    <!-- Right: specimen card -->
    <div style="flex: 1.1; background:#161616; border:1px solid rgba(255,255,255,0.06); border-radius:20px; padding: 18px 18px 16px; display:flex; flex-direction:column;">
      <!-- header row -->
      <div style="display:flex; justify-content:space-between; align-items:flex-end; padding-bottom: 12px; border-bottom:1px solid rgba(255,255,255,0.08);">
        <div style="font-size:28px; font-weight:500; letter-spacing:-0.6px; color:#FFF;">System Font</div>
        <div style="font-size:12px; color:#A3FF12; font-weight:600;">Sans Serif</div>
      </div>
      <!-- weight rows -->
      <div style="display:flex; flex-direction:column; gap: 10px; padding-top: 12px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:20px; font-weight:700; color:#FFF;">Bold</span>
          <span style="font-size:13px; font-weight:700; color:#E5E7EB;">Aa Bb Cc Dd Ee Ff</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:20px; font-weight:500; color:#FFF;">Medium</span>
          <span style="font-size:13px; font-weight:500; color:#E5E7EB;">Aa Bb Cc Dd Ee Ff</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:20px; font-weight:400; color:#9CA3AF;">Regular</span>
          <span style="font-size:13px; font-weight:400; color:#9CA3AF;">Aa Bb Cc Dd Ee Ff</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
