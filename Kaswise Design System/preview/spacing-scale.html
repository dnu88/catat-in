<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing · Scale</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card" style="background:#0A0A0A; color:#FFF; padding: 22px 24px;">
  <div class="row" style="gap: 24px; align-items: stretch;">

    <!-- Left: eyebrow + heading -->
    <div class="col" style="flex: 1; justify-content: center; gap: 14px;">
      <div style="font-size:10px; font-weight:700; letter-spacing:0.16em; color:#A3FF12; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">
        07 · SPACING
      </div>
      <div style="font-size:34px; font-weight:800; letter-spacing:-0.8px; line-height:1.05; color:#FFF;">
        4 px, on a tick.
      </div>
      <div style="font-size:12px; line-height:1.55; color:#9CA3AF; max-width: 38ch;">
        One base unit, seven steps. Never half-step. The 4 px tick keeps screens locked to a consistent rhythm — tight enough for mobile, generous enough for breathing room.
      </div>
    </div>

    <!-- Right: specimen card -->
    <div style="flex: 1.1; background:#161616; border:1px solid rgba(255,255,255,0.06); border-radius:20px; padding: 18px 20px; display:flex; flex-direction:column;">
      <!-- header row -->
      <div style="display:flex; justify-content:space-between; align-items:flex-end; padding-bottom: 12px; border-bottom:1px solid rgba(255,255,255,0.08);">
        <div style="font-size:26px; font-weight:500; letter-spacing:-0.5px; color:#FFF;">Spacing scale</div>
        <div style="font-size:12px; color:#A3FF12; font-weight:600;">7 steps</div>
      </div>

      <!-- specimen rows -->
      <div style="display:flex; flex-direction:column; gap: 10px; padding-top: 14px;">
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="width:90px; font-size:13px; font-weight:700; color:#FFF;">xs</div>
          <div style="flex:1; height:16px; display:flex; align-items:center;">
            <div style="width:4px; height:16px; background:#A3FF12; border-radius:2px;"></div>
          </div>
          <div style="font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#9CA3AF;">4 px</div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="width:90px; font-size:13px; font-weight:700; color:#FFF;">sm</div>
          <div style="flex:1; height:16px; display:flex; align-items:center;">
            <div style="width:8px; height:16px; background:#A3FF12; border-radius:2px;"></div>
          </div>
          <div style="font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#9CA3AF;">8 px</div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="width:90px; font-size:13px; font-weight:700; color:#FFF;">md</div>
          <div style="flex:1; height:16px; display:flex; align-items:center;">
            <div style="width:12px; height:16px; background:#A3FF12; border-radius:2px;"></div>
          </div>
          <div style="font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#9CA3AF;">12 px</div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="width:90px; font-size:13px; font-weight:700; color:#FFF;">lg</div>
          <div style="flex:1; height:16px; display:flex; align-items:center;">
            <div style="width:16px; height:16px; background:#A3FF12; border-radius:2px;"></div>
          </div>
          <div style="font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#9CA3AF;">16 px</div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="width:90px; font-size:13px; font-weight:700; color:#FFF;">xl</div>
          <div style="flex:1; height:16px; display:flex; align-items:center;">
            <div style="width:20px; height:16px; background:#A3FF12; border-radius:2px;"></div>
          </div>
          <div style="font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#9CA3AF;">20 px</div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="width:90px; font-size:13px; font-weight:700; color:#FFF;">2xl</div>
          <div style="flex:1; height:16px; display:flex; align-items:center;">
            <div style="width:24px; height:16px; background:#A3FF12; border-radius:2px;"></div>
          </div>
          <div style="font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#9CA3AF;">24 px</div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="width:90px; font-size:13px; font-weight:700; color:#FFF;">3xl</div>
          <div style="flex:1; height:16px; display:flex; align-items:center;">
            <div style="width:32px; height:16px; background:#A3FF12; border-radius:2px;"></div>
          </div>
          <div style="font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#9CA3AF;">32 px</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
