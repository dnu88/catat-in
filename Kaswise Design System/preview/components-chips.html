<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Components · Chips & Pills</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
</head>
<body>
<div class="card" style="background:#0A0A0A; color:#FFF; padding: 22px 24px; gap: 18px;">
  <div>
    <div style="font-size:11px; font-weight:700; letter-spacing:0.18em; color:#A3FF12; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">CHIPS &amp; PILLS</div>
    <div style="font-size:30px; font-weight:800; letter-spacing:-0.7px; color:#FFF; margin-top: 6px;">Glass tokens, neon signals.</div>
  </div>

  <!-- Row 1: glass wallet pill + delta pill (lifted from the UI implementation board) -->
  <div style="font-size:10px; font-weight:700; letter-spacing:0.12em; color:#6B7280; text-transform:uppercase;">In-context</div>
  <div class="row" style="gap: 10px; flex-wrap: wrap; align-items: center;">
    <!-- glass wallet selector -->
    <span style="display:inline-flex; align-items:center; gap:8px; background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.10); border-radius:999px; padding:8px 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size:12px; font-weight:700; color:#E5E7EB; font-family: var(--ks-font-sans);">
      <i class="ph-bold ph-wallet" style="font-size:13px; color:#9CA3AF;"></i>
      Main Wallet
      <i class="ph-bold ph-caret-down" style="font-size:11px; color:#6B7280;"></i>
    </span>
    <!-- delta pill: 15% from previous -->
    <span style="display:inline-flex; align-items:center; gap:6px; background: rgba(163,255,18,0.12); border-radius:6px; padding:5px 9px; font-size:11px; font-weight:700; color:#A3FF12; font-family: var(--ks-font-sans);">
      <i class="ph-bold ph-trend-up" style="font-size:12px;"></i>
      15% from previous
    </span>
    <!-- status dot pill -->
    <span style="display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.10); backdrop-filter: blur(10px); font-size:11px; font-weight:600; color:#E5E7EB; font-family: var(--ks-font-sans);">
      <span style="width:6px; height:6px; border-radius:50%; background:#A3FF12; box-shadow: 0 0 6px #A3FF12;"></span>
      AI · siap
    </span>
    <!-- ghost link -->
    <span style="font-size:12px; font-weight:600; color:#9CA3AF; font-family: var(--ks-font-sans); cursor:pointer;">Manage</span>
  </div>

  <!-- Row 2: filter pills -->
  <div style="font-size:10px; font-weight:700; letter-spacing:0.12em; color:#6B7280; text-transform:uppercase; margin-top:4px;">Filter</div>
  <div class="row" style="gap: 8px; flex-wrap: wrap;">
    <span style="background:#A3FF12; color:#0A0A0A; border:1px solid #A3FF12; border-radius:999px; padding:7px 14px; font-size:12px; font-weight:800; font-family: var(--ks-font-sans);">Bulan ini</span>
    <span style="background: rgba(255,255,255,0.05); color:#E5E7EB; border:1px solid rgba(255,255,255,0.12); border-radius:999px; padding:7px 14px; font-size:12px; font-weight:700; font-family: var(--ks-font-sans);">Semua wallet</span>
    <span style="background: rgba(255,123,123,0.10); color:#FF7B7B; border:1px solid rgba(255,123,123,0.30); border-radius:999px; padding:7px 14px; font-size:12px; font-weight:700; font-family: var(--ks-font-sans);">Expense</span>
    <span style="background: rgba(163,255,18,0.10); color:#A3FF12; border:1px solid rgba(163,255,18,0.30); border-radius:999px; padding:7px 14px; font-size:12px; font-weight:700; font-family: var(--ks-font-sans);">Income</span>
  </div>

  <!-- Row 3: month chips -->
  <div style="font-size:10px; font-weight:700; letter-spacing:0.12em; color:#6B7280; text-transform:uppercase;">Month chip row</div>
  <div class="row" style="gap: 8px;">
    <div style="flex:1; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:10px 0; text-align:center; font-size:12px; font-weight:700; color:#9CA3AF; font-family: var(--ks-font-sans);">Feb</div>
    <div style="flex:1; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:10px 0; text-align:center; font-size:12px; font-weight:700; color:#9CA3AF; font-family: var(--ks-font-sans);">Mar</div>
    <div style="flex:1; background: rgba(163,255,18,0.12); border:1px solid rgba(163,255,18,0.35); border-radius:12px; padding:10px 0; text-align:center; font-size:12px; font-weight:800; color:#A3FF12; font-family: var(--ks-font-sans);">Apr</div>
    <div style="flex:1; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:10px 0; text-align:center; font-size:12px; font-weight:700; color:#9CA3AF; font-family: var(--ks-font-sans);">Mei</div>
  </div>
</div>
</body>
</html>
