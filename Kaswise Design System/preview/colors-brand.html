<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colors · Brand</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card" style="background:#0A0A0A; color:#FFF; padding: 22px 24px; gap: 18px;">
  <div>
    <div style="font-size:11px; font-weight:700; letter-spacing:0.18em; color:#A3FF12; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">COLOR PALETTE</div>
    <div style="font-size:30px; font-weight:800; letter-spacing:-0.7px; color:#FFF; margin-top: 6px;">Dark Luxury UI.</div>
  </div>

  <div class="row" style="gap: 16px; align-items: stretch;">
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="height:104px; border-radius:16px; background:#A3FF12; box-shadow: 0 10px 36px rgba(163,255,18,0.30);"></div>
      <div style="font-size:14px; font-weight:800; color:#FFF;">Neon Emerald</div>
      <div style="font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#9CA3AF;">#A3FF12</div>
      <div style="font-size:11px; color:#6B7280; line-height:1.5;">Primary Accent / Growth indicators / CTAs</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="height:104px; border-radius:16px; background:#4A80F0;"></div>
      <div style="font-size:14px; font-weight:800; color:#FFF;">Soft Navy</div>
      <div style="font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#9CA3AF;">#4A80F0</div>
      <div style="font-size:11px; color:#6B7280; line-height:1.5;">Secondary Accent / Data visualization</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="height:104px; border-radius:16px; background:#1E1E1A; border:1px solid rgba(255,255,255,0.05);"></div>
      <div style="font-size:14px; font-weight:800; color:#FFF;">Surface Grey</div>
      <div style="font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#9CA3AF;">#1E1E1A</div>
      <div style="font-size:11px; color:#6B7280; line-height:1.5;">Card Backgrounds / UI Elements</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="height:104px; border-radius:16px; background:#141414; border:1px solid rgba(255,255,255,0.06);"></div>
      <div style="font-size:14px; font-weight:800; color:#FFF;">Matte Black</div>
      <div style="font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color:#9CA3AF;">#141414</div>
      <div style="font-size:11px; color:#6B7280; line-height:1.5;">Main App Background</div>
    </div>
  </div>
</div>
</body>
</html>
