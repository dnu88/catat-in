<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Components · Status Badges</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card" style="background:#0A0A0A; color:#FFF; padding: 22px 24px; gap: 18px;">
  <div>
    <div style="font-size:11px; font-weight:700; letter-spacing:0.18em; color:#A3FF12; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">STATUS BADGES</div>
    <div style="font-size:30px; font-weight:800; letter-spacing:-0.7px; color:#FFF; margin-top: 6px;">One look. Five tones.</div>
  </div>

  <div class="row" style="gap: 10px; flex-wrap: wrap; align-items: center; padding: 4px 0;">
    <span style="background: rgba(163,255,18,0.14); color:#A3FF12; border:1px solid rgba(163,255,18,0.40); border-radius:999px; padding:5px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em; font-family: var(--ks-font-sans);">Aman</span>
    <span style="background: rgba(255,192,109,0.14); color:#FFC06D; border:1px solid rgba(255,192,109,0.40); border-radius:999px; padding:5px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em; font-family: var(--ks-font-sans);">Hampir habis</span>
    <span style="background: rgba(255,123,123,0.14); color:#FF7B7B; border:1px solid rgba(255,123,123,0.40); border-radius:999px; padding:5px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em; font-family: var(--ks-font-sans);">Melebihi</span>
    <span style="background: rgba(74,128,240,0.14); color:#4A80F0; border:1px solid rgba(74,128,240,0.40); border-radius:999px; padding:5px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em; font-family: var(--ks-font-sans);">Premium</span>
    <span style="background: rgba(56,189,248,0.14); color:#38BDF8; border:1px solid rgba(56,189,248,0.40); border-radius:999px; padding:5px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em; font-family: var(--ks-font-sans);">AI · 0.92</span>
  </div>

  <div class="row" style="gap: 10px; flex-wrap: wrap; align-items: center;">
    <span style="background: rgba(163,255,18,0.14); color:#A3FF12; border:1px solid rgba(163,255,18,0.40); border-radius:999px; padding:5px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em; font-family: var(--ks-font-sans);">SUCCESS</span>
    <span style="background: rgba(255,123,123,0.14); color:#FF7B7B; border:1px solid rgba(255,123,123,0.40); border-radius:999px; padding:5px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em; font-family: var(--ks-font-sans);">FAILED</span>
    <span style="background: rgba(255,192,109,0.14); color:#FFC06D; border:1px solid rgba(255,192,109,0.40); border-radius:999px; padding:5px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em; font-family: var(--ks-font-sans);">PENDING</span>
    <span style="background: rgba(74,128,240,0.14); color:#4A80F0; border:1px solid rgba(74,128,240,0.40); border-radius:999px; padding:5px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em; font-family: var(--ks-font-sans);">BETA</span>
    <span style="background: rgba(255,255,255,0.06); color:#9CA3AF; border:1px solid rgba(255,255,255,0.18); border-radius:999px; padding:5px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em; font-family: var(--ks-font-sans);">DRAFT</span>
  </div>

  <div style="font-size:11px; color:#6B7280; line-height:1.6;">
    Recipe on dark surfaces: <b style="color:#9CA3AF;">color@14%</b> background · <b style="color:#9CA3AF;">color@40%</b> border · full-saturation text. 11 px, 800 weight, capsule. Never invert (no full-fill badges — those are buttons).
  </div>
</div>
</body>
</html>
