<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Components · Buttons (Light)</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card" style="background:#F5F5F0; color:#0A0A0A; padding: 22px 24px; gap: 18px;">
  <div>
    <div style="font-size:11px; font-weight:700; letter-spacing:0.18em; color:#65A30D; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">BUTTONS · LIGHT</div>
    <div style="font-size:30px; font-weight:800; letter-spacing:-0.7px; color:#0A0A0A; margin-top: 6px;">Press for prosperity.</div>
  </div>

  <div class="row" style="gap: 12px; flex-wrap: wrap; align-items: center;">
    <button style="
      background:#A3FF12; color:#0A0A0A; border:none; border-radius:999px;
      padding:14px 22px; font-size:14px; font-weight:800; letter-spacing:0.02em;
      font-family: var(--ks-font-sans); cursor:pointer;
      box-shadow: 0 12px 28px rgba(163,255,18,0.35);">
      Simpan transaksi
    </button>
    <button style="
      background:#FFFFFF; color:#0A0A0A;
      border:1px solid rgba(10,10,10,0.10); border-radius:999px;
      padding:14px 22px; font-size:14px; font-weight:700;
      font-family: var(--ks-font-sans); cursor:pointer;
      box-shadow: 0 2px 6px rgba(10,10,10,0.04);">
      Lewati
    </button>
    <button style="
      background: rgba(220,38,38,0.08); color:#DC2626;
      border:1px solid rgba(220,38,38,0.25); border-radius:999px;
      padding:14px 22px; font-size:14px; font-weight:800;
      font-family: var(--ks-font-sans); cursor:pointer;">
      Hapus
    </button>
    <button style="
      background: transparent; color:#4B5563; border:none;
      padding:14px 18px; font-size:14px; font-weight:700;
      font-family: var(--ks-font-sans); cursor:pointer;">
      Batalkan
    </button>
  </div>

  <div class="row" style="gap: 12px; flex-wrap: wrap; align-items: center;">
    <button style="
      background:#A3FF12; color:#0A0A0A; border:none; border-radius:999px;
      padding:9px 16px; font-size:12px; font-weight:800;
      font-family: var(--ks-font-sans); cursor:pointer;
      box-shadow: 0 6px 16px rgba(163,255,18,0.25);">
      + Tambah
    </button>
    <button style="
      background:#0A0A0A; color:#FFFFFF; border:none; border-radius:999px;
      padding:8px 12px; font-size:11px; font-weight:800; letter-spacing:0.04em;
      font-family: var(--ks-font-sans); cursor:pointer;">
      RESET
    </button>
    <button style="
      width:48px; height:48px; border-radius:50%;
      background:#A3FF12; color:#0A0A0A; border:none;
      font-size:22px; font-weight:800; cursor:pointer;
      box-shadow: 0 12px 28px rgba(163,255,18,0.40);">
      +
    </button>
    <button style="
      background:#FFFFFF; color:#9CA3AF; border:1px solid rgba(10,10,10,0.08); border-radius:999px;
      padding:14px 22px; font-size:14px; font-weight:800;
      font-family: var(--ks-font-sans); opacity:0.65; cursor:not-allowed;">
      Loading…
    </button>
  </div>

  <div style="font-size:11px; color:#9CA3AF; line-height:1.55;">
    Primary keeps the neon fill + black text — its glow softens on light (28 px @35%, no inner ring). Secondary trades glass for white-on-bone with a 1 px hairline + tiny shadow. Danger sits on warm red <b style="color:#DC2626;">#DC2626</b> at 8% fill. Ghost is text-only.
  </div>
</div>
</body>
</html>
